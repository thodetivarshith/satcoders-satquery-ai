name: Evaluation Test

on:
  push:
  pull_request:
    

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version:"3.11" 
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn matplotlib pytest requests
      
      - name: Run tests
        run: python -m pytest evaluation/test_data.py

        
   
