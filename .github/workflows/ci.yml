name: Performance and Robustness Testing

on:
  push:
    branches:
      - main
      - kunchala/preprocessing
  pull_request:
    branches:
      - main
      - kunchala/preprocessing

jobs:
  performance-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy rasterio

      - name: Run performance and robustness test
        run: |
          python data_processing/test_data.py